services:
  - type: web
    name: princessitas-crm-mayoreo
    env: node
    plan: free
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL se configura en el dashboard de Render (Environment):
      # cadena de conexión (pool) de Neon, con sslmode=require.
      # No se pone ningún valor real en este archivo.
      - key: DATABASE_URL
        sync: false
